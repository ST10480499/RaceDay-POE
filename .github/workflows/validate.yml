name: Validate Repository Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing"
            exit 1
          fi
          echo "docs folder found"

      - name: Check ERD image exists
        run: |
          if ! ls docs/*.png docs/*.pdf 1> /dev/null 2>&1; then
            echo "ERROR: No ERD image (.png or .pdf) found in /docs"
            exit 1
          fi
          echo "ERD file found"

      - name: Check SQL script exists
        run: |
          if ! ls docs/*.sql 1> /dev/null 2>&1; then
            echo "ERROR: No .sql file found in /docs"
            exit 1
          fi
          echo "SQL script found"

      - name: Check endpoint plan exists
        run: |
          if ! ls docs/*.pdf docs/*.md 1> /dev/null 2>&1; then
            echo "ERROR: No endpoint plan (.pdf or .md) found in /docs"
            exit 1
          fi
          echo "Endpoint plan found"
