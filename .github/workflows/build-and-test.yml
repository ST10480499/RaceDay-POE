name: Build and Test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: dotnet restore Part2-API/RaceDay/RaceDay.sln

      - name: Build solution
        run: dotnet build Part2-API/RaceDay/RaceDay.sln --no-restore --configuration Release

      - name: Build MVC project
        run: dotnet build Part2-API/RaceDay/RaceDay.Web/RaceDay.Web.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Part2-API/RaceDay/RaceDay.sln --no-build --configuration Release --verbosity normal

      - name: Build Docker image for the MVC app
        run: docker build -t raceday-web Part2-API/RaceDay/RaceDay.Web
